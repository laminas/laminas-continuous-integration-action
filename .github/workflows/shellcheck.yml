name: "ShellCheck"

on:
  pull_request:
  push:
    branches:
      - '[0-9]+.[0-9]+.x'
      - 'refs/pull/*'
    tags:

jobs:
  shellcheck:
    name: "ShellCheck"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7

      - name: "Run ShellCheck"
        uses: "reviewdog/action-shellcheck@b4ffc0b2a69f857f82b74d1310cd3e62e932f9f7" # v1
        with:
          fail_on_error: true
